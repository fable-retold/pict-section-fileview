services:

  # Cross-engine source store for the 4.x leg.
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: "CloneHarness1!"
      POSTGRES_DB: source4x
    ports:
      - "15433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d source4x"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  # MSSQL source store.  Opt-in profile:
  #   docker compose --profile mssql up -d mssql
  #   SOURCE_ENGINE=mssql ./Run.sh 4x
  #
  # cpuset is REQUIRED on hosts whose online CPU mask has gaps (check
  # `lscpu | grep -i off-line`).  SQL Server's SQLPAL aborts at startup on a
  # gapped mask; pin it to a contiguous run of online CPUs.  Override with
  # MSSQL_CPUSET when 0-7 is not online on your host.
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    profiles: ["mssql"]
    cpuset: "${MSSQL_CPUSET:-0-7}"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "CloneHarness1!"
      MSSQL_PID: "Developer"
    ports:
      - "11433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # Clone target for both legs, and the source store for the 2.x leg.
  # 5.7 because the legacy stack pins mysql2 1.5.2, which predates MySQL 8 auth.
  mysql:
    image: mysql:5.7
    command: --sql-mode=""
    environment:
      MYSQL_ROOT_PASSWORD: "CloneHarness1!"
    ports:
      - "13306:3306"
    volumes:
      - ./sql/mysql-init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  # Source API on the CURRENT retold stack: meadow-endpoints 4.x / orator 6 /
  # fable 3.  Storage engine selectable via SOURCE_ENGINE (postgres | mssql).
  source-4x:
    build:
      context: .
      dockerfile: source-4x/Dockerfile
    environment:
      SOURCE_ENGINE: "${SOURCE_ENGINE:-postgres}"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "CloneHarness1!"
      POSTGRES_DATABASE: source4x
      MSSQL_HOST: mssql
      MSSQL_PORT: "1433"
      MSSQL_USER: sa
      MSSQL_PASSWORD: "CloneHarness1!"
      MSSQL_DATABASE: source4x
      API_PORT: "8086"
    ports:
      - "18186:8086"
    depends_on:
      postgres:
        condition: service_healthy

  # Source API on the LEGACY stack Headlight runs in production:
  # meadow-endpoints 2.1.1 / meadow 1.0.35 / orator 2.0.10 / restify 6.4.0.
  # MySQL-backed because meadow 1.0.x ships no MSSQL or PostgreSQL provider.
  source-2x:
    build:
      context: .
      dockerfile: source-2x/Dockerfile
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: "CloneHarness1!"
      MYSQL_DATABASE: source2x
      API_PORT: "8086"
    ports:
      - "18187:8086"
    depends_on:
      mysql:
        condition: service_healthy

  # The system under test: meadow-integration's clone, built from the local
  # working tree, cloning each source into its own MySQL database.
  clone:
    build:
      context: ../..
      dockerfile: integration/mssql-to-mysql-clone/clone/Dockerfile
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: "CloneHarness1!"
      SOURCE_4X_URL: "http://source-4x:8086/1.0/"
      SOURCE_2X_URL: "http://source-2x:8086/1.0/"
      SOURCE_2X_MYSQL_DATABASE: source2x
      # The runner resets each source store directly between scenarios, and the
      # 2.x leg restores records there (meadow-endpoints 2.x has no un-delete).
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "CloneHarness1!"
      POSTGRES_DATABASE: source4x
      # Used instead of the postgres block when the 4.x source runs on MSSQL.
      MSSQL_HOST: mssql
      MSSQL_PORT: "1433"
      MSSQL_USER: sa
      MSSQL_PASSWORD: "CloneHarness1!"
      MSSQL_DATABASE: source4x
    depends_on:
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy
